[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eras"
version = "0.1.0"
description = "Predicting Taylor Swift's Eras Tour outfits and surprise songs for the Swift Alert Mastermind game"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "pandas>=2.0"]

[project.optional-dependencies]
prophet = ["prophet"]                      # the original article's method (backtest only)
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
notebooks = ["matplotlib", "jinja2", "ipykernel"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eras*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
