# Every push to main: test the server and build the UI, then deploy to Cloud Run (project-playground-mazi).
# GitHub signs in to Google Cloud with workload identity federation - no keys or secrets are stored. Only pushes to
# main of this repo are trusted. The data tables are not in the repo: they stay in the private bucket the service mounts.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button on GitHub, to redeploy by hand

concurrency:
  group: deploy
  cancel-in-progress: false # never cancel a deploy halfway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: genrec/pyproject.toml
      - name: Server tests
        run: |
          pip install "./genrec[serve]" pytest httpx
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the UI (type check + bundle)
        working-directory: web
        run: |
          npm ci --no-fund --no-audit
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # lets GitHub prove to Google Cloud which repo and branch is asking
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/114282263198/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@project-playground-mazi.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Same command as a manual deploy; the service keeps its settings (bucket mount, env, scaling, public access)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy playground --source . \
            --region=asia-southeast2 --project=project-playground-mazi --quiet

      - name: Smoke test
        run: |
          url=$(gcloud run services describe playground --region=asia-southeast2 --project=project-playground-mazi \
                --format='value(status.url)')
          curl -fsS "$url/api/health" | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null "$url/projects/genrec"
          echo "live: $url"
