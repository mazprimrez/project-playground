# The live model service (genrec-model on Cloud Run): rebuilt only when its code or the genrec package changes,
# so site-only pushes stay fast. Same keyless sign-in as deploy.yml. The model weights are not in the repo: the
# service downloads them at startup from the private Hugging Face repo (HF_TOKEN comes from Secret Manager).
name: Deploy model service

on:
  push:
    branches: [main]
    paths:
      - genrec/inference/**
      - genrec/src/**
      - "!genrec/src/genrec/lookup.py"     # the API's tables, not used by the model service
      - genrec/pyproject.toml
      - .github/workflows/deploy-model.yml
  workflow_dispatch:

concurrency:
  group: deploy-model
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/114282263198/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@project-playground-mazi.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # The service keeps its settings (CPU, memory, secret, runtime account, scaling caps, public access)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy genrec-model --source genrec/inference \
            --region=asia-southeast2 --project=project-playground-mazi --quiet

      - name: Smoke test (waits for the model to load)
        run: |
          url=$(gcloud run services describe genrec-model --region=asia-southeast2 --project=project-playground-mazi \
                --format='value(status.url)')
          curl -fsS --max-time 300 "$url/health"
          echo "live: $url"
